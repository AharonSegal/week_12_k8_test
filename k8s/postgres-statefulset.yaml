apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: postgres-svc
  replicas: 3
  
  selector:
    matchLabels:
      app: post-pod
  
  template:
    metadata:
      labels:
        app: post-pod
    spec:
      containers:
      - name: postgres
        image: postgres:15
        
        ports:
        - containerPort: 5432
          name: post
        
        env:
        - name: POSTGRES_HOST       
          value: postgres-svc 

        - name: POSTGRES_DB
          value: "coordinates_db"
        
        - name: POSTGRES_USER
          value: "postgres"
        
        - name: POSTGRES_PASSWORD
          value: "postgres"

        volumeMounts:
        - name: postgres-storage 
          mountPath: /var/lib/postgresql/data

  volumeClaimTemplates:
  - metadata:
      name: postgres-storage
    spec:
      accessModes: [ "ReadWriteOnce" ]
      
      resources:
        requests:
          storage: 1Gi


