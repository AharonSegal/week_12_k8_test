apiVersion: apps/v1
kind: Deployment
metadata:
  name: coordinates-api
  labels:
    app: api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: api
  
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
      - name: coordinates-api

        image: aharonsegal/coordinates_api:v2
        
        ports:
        - containerPort: 8000
          name: http
        
        env:
        - name: POSTGRES_HOST
          value: "postgres-0.postgres-svc"
        
        - name: POSTGRES_PORT
          value: "5432"
        
        - name: POSTGRES_DB
          value: "coordinates_db"
        
        - name: POSTGRES_USER
          value: "postgres"
        
        - name: POSTGRES_PASSWORD
          value: "postgres"
        
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "200m"
        
